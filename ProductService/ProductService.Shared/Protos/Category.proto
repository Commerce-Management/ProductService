syntax = "proto3";

option csharp_namespace = "ProductService.Shared.Protos.GrpcCategoryService";
package category;

service CategoryService {
  rpc GetCategoryById(GetCategoryByIdRequest) returns (GetCategoryByIdResponse);
}

message GetCategoryByIdRequest { string category_id = 1; }

message GetCategoryByIdResponse { CategoryDto category = 1; }

message CategoryDto {
  string id = 1;
  string name = 2;
  string description = 3;
  string slug = 4;
  int32 level = 5;
  int32 sort_order = 6;
  string image_url = 7;
  bool is_active = 8;
  bool is_visible = 9;

  CategoryShortDto parent_category = 10;
  repeated CategoryShortDto children = 11;
  repeated CategoryShortDto parents = 12;
}

message CategoryShortDto {
  string id = 1;
  string name = 2;
  int32 level = 3;
}
